  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    :root {
      --bg: #f8f4f0;
      --card: #ffffff;
      --text: #2c2c2c;
      --muted: #6b6b6b;
      --accent: #e07a5f;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      max-width: 428px;
      margin: 0 auto;
      min-height: 100vh;
      background: linear-gradient(180deg, #fdf8f4 0%, #f5ebe4 100%);
    }

    .family-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 0;
    }

    .family-switcher {
      display: flex;
      flex: 1;
      gap: 8px;
    }

    .family-tab {
      flex: 1;
      padding: 12px 8px;
      border-radius: 14px;
      background: rgba(255,255,255,0.75);
      border: 1.5px solid #e5d8d0;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .family-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 15px rgba(224, 122, 95, 0.35);
    }

    /* Анимированная градиентная кнопка + */
    .add-btn-inline {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #e07a5f, #f2cc8f, #e07a5f);
      background-size: 200% 200%;
      color: white;
      font-size: 26px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(224, 122, 95, 0.4);
      animation: gradientShift 4s ease infinite;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      line-height: 1;
    }

    .add-btn-inline:active {
      transform: scale(0.9) rotate(90deg);
      box-shadow: 0 2px 8px rgba(224, 122, 95, 0.2);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px 20px 20px;
    }

    .photo-wrap {
      width: 100px;
      height: 100px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(224, 122, 95, 0.28);
      border: 4px solid white;
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header-text { flex: 1; min-width: 0; }

    .name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .contact {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 8px 16px 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 10px 18px;
      border-radius: 100px;
      background: white;
      border: 1.5px solid #eee;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(224, 122, 95, 0.35);
    }

    .list {
      padding: 0 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 200px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      animation: fadeIn 0.25s ease;
    }

    .item.done {
      opacity: 0.55;
    }

    .item.done .item-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .item:active { transform: scale(0.98); }

    .item-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #fff5f0, #ffe8d6);
      overflow: hidden;
    }

    .item-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item-text { flex: 1; min-width: 0; }
    .item-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .item-creator { font-size: 12px; color: #aaa; }

    .item-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .action-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .done-btn { background: #e8f8ef; color: #27ae60; }
    .undone-btn { background: #fff5e6; color: #e67e22; }
    .edit-btn { background: #f0f4ff; color: #3b82f6; }
    .delete-btn { background: #fff0f0; color: #e74c3c; font-size: 17px; }

    .empty, .loading {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #eee;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: 0.25s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      max-width: 428px;
      margin: 0 auto;
    }

    .overlay.open { opacity: 1; visibility: visible; }

    .modal {
      background: white;
      border-radius: 24px;
      padding: 28px 24px 32px;
      width: 100%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(40px);
      transition: 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .overlay.open .modal { transform: translateY(0); }

    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .modal-body { font-size: 15px; color: var(--muted); line-height: 1.5; margin-bottom: 20px; }

    .modal-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: linear-gradient(135deg, #fff5f0, #ffe8d6);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .modal-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .form-group label .req { color: #e74c3c; }
    .form-group label .opt { color: #aaa; font-weight: 400; }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #eee;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: #fafafa;
      outline: none;
    }

    .form-group textarea { height: 80px; resize: none; }

    .photo-preview {
      width: 100%;
      max-height: 160px;
      border-radius: 12px;
      object-fit: cover;
      margin-top: 8px;
      display: none;
    }

    .photo-preview.show { display: block; }

    .photo-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .photo-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .photo-select { background: #f0f4ff; color: #3b82f6; }
    .photo-remove { background: #fff0f0; color: #e74c3c; display: none; }
    .photo-remove.show { display: block; }

    .modal-close, .modal-save {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    .modal-close { background: #f0f0f0; color: #333; }
    .modal-save { background: var(--accent); color: white; }
    .modal-save:disabled, .modal-close:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-row { display: flex; gap: 10px; }
    .btn-row button { flex: 1; }
    .btn-danger { background: #e74c3c !important; color: white !important; }

    .status {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      opacity: 0;
      transition: 0.3s;
      z-index: 200;
      pointer-events: none;
    }

    .status.show { opacity: 1; }

    @supports (padding: max(0px)) {
      .family-bar { padding-top: max(16px, env(safe-area-inset-top) + 12px); }
      .list { padding-bottom: max(40px, env(safe-area-inset-bottom) + 24px); }
      .overlay { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

  <div class="family-bar">

      <div class="form-group">

  <!-- Удаление -->

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAj76TWoUc4ZHEHRHEHTCrd2_b3wgwd2oM",
      authDomain: "lusine-2f8d8.firebaseapp.com",
      databaseURL: "https://lusine-2f8d8-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "lusine-2f8d8",
      storageBucket: "lusine-2f8d8.firebasestorage.app",
      messagingSenderId: "22488560137",
      appId: "1:22488560137:web:5acc1c2683a41df9ec7ed8"
    };

    const EMAILJS_PUBLIC_KEY = "mWgMLBD4eFHmg5jUe";
    
    const EMAILJS_CONFIG = {
      lusine: {
        serviceId: "service_n4yi0ae",
        newTemplate: "template_5j0jf3r",
        doneTemplate: "template_nwiado5"
      },
      david_anna: {
        serviceId: "service_r0uk3u7",
        newTemplate: "template_9msxzwb",
        doneTemplate: "template_vlh038h"
      }
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    emailjs.init(EMAILJS_PUBLIC_KEY);

    const emptyStructure = () => ({ home: [], docs: [], car: [], health: [] });

    let familiesData = {
      lusine: emptyStructure(),
      david_anna: emptyStructure()
    };

    let currentFamily = 'lusine';
    let currentCat = 'home';
    let itemToDelete = null;
    let editingItem = null;
    let currentPhoto = null;
    let isSaving = false;
    let isDataLoaded = false;
    
    let isCompleting = false;
    let isRestoring = false;

    const listEl = document.getElementById('list');
    const tabs = document.querySelectorAll('.tab');
    const familyTabs = document.querySelectorAll('.family-tab');
    const statusEl = document.getElementById('status');
    const photoInput = document.getElementById('editPhoto');
    const photoPreview = document.getElementById('photoPreview');
    const photoRemoveBtn = document.getElementById('photoRemoveBtn');
    const saveBtn = document.getElementById('editSave');

    function showStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.add('show');
      setTimeout(() => statusEl.classList.remove('show'), 2500);
    }

    db.ref().on('value', (snapshot) => {
      const val = snapshot.val() || {};
      
      let lusineVal = val.needs_lusine || (val.needs ? val.needs : val);
      let davidVal = val.needs_david_anna || {};

      familiesData.lusine = Object.assign(emptyStructure(), lusineVal);
      familiesData.david_anna = Object.assign(emptyStructure(), davidVal);
      
      isDataLoaded = true;
      renderList();
    }, (error) => {
      console.error("Firebase error:", error);
      isDataLoaded = true;
      renderList();
    });

    async function saveFamilyData(family) {
      if (family === 'lusine') {
        await db.ref('needs').set(familiesData.lusine);
        await db.ref('needs_lusine').set(familiesData.lusine);
      } else {
        await db.ref('needs_david_anna').set(familiesData.david_anna);
      }
    }

    function updateHeaderView() {
      const nameEl = document.getElementById('headerName');
      const subtitleEl = document.getElementById('headerSubtitle');
      const contactEl = document.getElementById('headerContact');
      const photoEl = document.getElementById('headerPhoto');
      const pageTitleEl = document.getElementById('pageTitle');
      const faviconEl = document.getElementById('favicon');
      const faviconShortcutEl = document.getElementById('favicon-shortcut');
      const appleIconEl = document.getElementById('apple-icon');
      const appleIcon180El = document.getElementById('apple-icon-180');

      if (currentFamily === 'lusine') {
        nameEl.textContent = 'Lusine';
        subtitleEl.textContent = 'Список текущих нужд';
        contactEl.innerHTML = `<div>📍 200 voie de Julia, Le Cannet</div><a href="tel:+33768698812">📞 +33 7 68 69 88 12</a>`;
        photoEl.src = 'lusine-circle.png';
        pageTitleEl.textContent = 'Lusine — Нужды';
        faviconEl.href = 'lusine-circle.png';
        faviconShortcutEl.href = 'lusine-circle.png';
        appleIconEl.href = 'lusine-circle.png';
        appleIcon180El.href = 'lusine-circle.png';
      } else {
        nameEl.textContent = 'David & Anna';
        subtitleEl.textContent = 'Семейный список задач';
        contactEl.innerHTML = `<div>📍 David & Anna</div>`;
        photoEl.src = 'david-circle.PNG';
        pageTitleEl.textContent = 'David & Anna — Нужды';
        faviconEl.href = 'david-circle.PNG';
        faviconShortcutEl.href = 'david-circle.PNG';
        appleIconEl.href = 'david-circle.PNG';
        appleIcon180El.href = 'david-circle.PNG';
      }
    }

    familyTabs.forEach(ftab => {
      ftab.addEventListener('click', () => {
        familyTabs.forEach(t => t.classList.remove('active'));
        ftab.classList.add('active');
        currentFamily = ftab.dataset.family;
        updateHeaderView();
        renderList();
      });
    });

    function getSortedItems(cat) {
      const currentFamObj = familiesData[currentFamily] || emptyStructure();
      const rawItems = currentFamObj[cat];
      
      let items = [];
      if (Array.isArray(rawItems)) {
        items = rawItems;
      } else if (rawItems && typeof rawItems === 'object') {
        items = Object.values(rawItems);
      }

      return items.filter(Boolean).sort((a, b) => {
        if (!!a.done !== !!b.done) return a.done ? 1 : -1;
        return (b.createdAt || 0) - (a.createdAt || 0);
      });
    }

    function renderList() {
      listEl.innerHTML = '';

      if (!isDataLoaded) {
        listEl.innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            <div>Загрузка списка…</div>
          </div>
        `;
        return;
      }

      const items = getSortedItems(currentCat);

      if (items.length === 0) {
        listEl.innerHTML = '<div class="empty">Пока нет пунктов<br>Нажмите + чтобы добавить</div>';
        return;
      }

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item' + (item.done ? ' done' : '');

        let iconHtml = item.icon || '📌';
        if (item.photo) {
          iconHtml = `<img src="${item.photo}" alt="">`;
        }

        const doneButton = item.done
          ? `<button class="action-btn undone-btn" title="Вернуть">↩</button>`
          : `<button class="action-btn done-btn" title="Выполнено">✓</button>`;

        el.innerHTML = `
          <div class="item-icon">${iconHtml}</div>
          <div class="item-text">
            <div class="item-title">${item.title}</div>
            <div class="item-creator">${item.creator ? 'Добавил: ' + item.creator : ''}${item.done && item.completedBy ? '<br>Выполнил: ' + item.completedBy : ''}</div>
          </div>
          <div class="item-actions">
            ${doneButton}
            <button class="action-btn edit-btn">✏️</button>
            <button class="action-btn delete-btn">×</button>
          </div>
        `;

        el.addEventListener('click', (e) => {
          if (e.target.closest('.action-btn')) return;
          openView(item);
        });

        const toggleBtn = el.querySelector('.done-btn, .undone-btn');
        if (toggleBtn) {
          toggleBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (!item.done) {
              window.completeItem = { family: currentFamily, cat: currentCat, item };
              document.getElementById('completeOverlay').classList.add('open');
            } else {
              window.restoreItem = { family: currentFamily, cat: currentCat, item };
              document.getElementById('restoreOverlay').classList.add('open');
            }
          });
        }

        el.querySelector('.edit-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          openEdit(item, currentCat, currentFamily);
        });

        el.querySelector('.delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          itemToDelete = { family: currentFamily, cat: currentCat, id: item.id, title: item.title };
          document.getElementById('deleteText').textContent = `Точно удалить «${item.title}»?`;
          document.getElementById('deleteOverlay').classList.add('open');
        });

        listEl.appendChild(el);
      });
    }

    document.getElementById('completeCancel').onclick = () => {
      if (isCompleting) return;
      document.getElementById('completeOverlay').classList.remove('open');
      window.completeItem = null;
    };

    document.getElementById('completeConfirm').onclick = async () => {
      if (isCompleting) return;
      
      const targetData = window.completeItem;
      if (!targetData) return;

      const confirmBtn = document.getElementById('completeConfirm');
      const cancelBtn = document.getElementById('completeCancel');

      isCompleting = true;
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = 'Сохранение...';

      const person = document.getElementById('completePerson').value;
      const item = targetData.item;
      item.done = true;
      item.completedBy = person;
      item.completedAt = Date.now();

      const emailConfig = EMAILJS_CONFIG[targetData.family];

      try {
        await saveFamilyData(targetData.family);

        try {
          await emailjs.send(emailConfig.serviceId, emailConfig.doneTemplate, {
            to_email: 'shapalax@gmail.com',
            title: item.title,
            detail: item.detail || '—',
            completed_by: person,
            date: new Date().toLocaleString('ru-RU')
          });
          showStatus('Выполнено + письмо отправлено');
        } catch(e) {
          console.error(e);
          showStatus('Выполнено (письмо не ушло)');
        }

        document.getElementById('completeOverlay').classList.remove('open');
        renderList();
      } catch (err) {
        console.error(err);
        showStatus('Ошибка при выполнении');
      } finally {
        isCompleting = false;
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = 'Подтвердить';
        window.completeItem = null;
      }
    };

    document.getElementById('restoreCancel').onclick = () => {
      if (isRestoring) return;
      document.getElementById('restoreOverlay').classList.remove('open');
      window.restoreItem = null;
    };

    document.getElementById('restoreConfirm').onclick = async () => {
      if (isRestoring) return;

      const targetData = window.restoreItem;
      if (!targetData) return;

      const confirmBtn = document.getElementById('restoreConfirm');
      const cancelBtn = document.getElementById('restoreCancel');

      isRestoring = true;
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = 'Возврат...';

      const item = targetData.item;
      item.done = false;
      item.completedBy = null;

      try {
        await saveFamilyData(targetData.family);
        document.getElementById('restoreOverlay').classList.remove('open');
        renderList();
        showStatus('Задание снова активно');
      } catch (err) {
        console.error(err);
        showStatus('Ошибка при возврате');
      } finally {
        isRestoring = false;
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = 'Да, сделать активным';
        window.restoreItem = null;
      }
    };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCat = tab.dataset.cat;
        renderList();
      });
    });

    function openView(item) {
      const iconEl = document.getElementById('viewIcon');
      if (item.photo) {
        iconEl.innerHTML = `<img src="${item.photo}" alt="">`;
      } else {
        iconEl.textContent = item.icon || '📌';
      }
      document.getElementById('viewTitle').textContent = item.title;
      document.getElementById('viewBody').textContent = item.detail || 'Нет дополнительной информации';
      document.getElementById('viewCreator').textContent = item.creator ? `Добавил: ${item.creator}` : '';
      document.getElementById('viewOverlay').classList.add('open');
    }

    document.getElementById('viewClose').onclick = () => {
      document.getElementById('viewOverlay').classList.remove('open');
    };

    document.getElementById('photoSelectBtn').onclick = () => photoInput.click();

    photoInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX = 600;
          let w = img.width;
          let h = img.height;
          if (w > h && w > MAX) {
            h = Math.round(h * MAX / w);
            w = MAX;
          } else if (h > MAX) {
            w = Math.round(w * MAX / h);
            h = MAX;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          currentPhoto = canvas.toDataURL('image/jpeg', 0.7);
          photoPreview.src = currentPhoto;
          photoPreview.classList.add('show');
          photoRemoveBtn.classList.add('show');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

    photoRemoveBtn.onclick = () => {
      currentPhoto = null;
      photoInput.value = '';
      photoPreview.src = '';
      photoPreview.classList.remove('show');
      photoRemoveBtn.classList.remove('show');
    };

    function resetPhotoUI() {
      currentPhoto = null;
      photoInput.value = '';
      photoPreview.src = '';
      photoPreview.classList.remove('show');
      photoRemoveBtn.classList.remove('show');
    }

    document.getElementById('addBtn').onclick = () => {
      editingItem = null;
      document.getElementById('editModalTitle').textContent = 'Новая потребность';
      document.getElementById('editFamily').value = currentFamily;
      document.getElementById('editCreator').value = '';
      document.getElementById('editCategory').value = '';
      document.getElementById('editTitle').value = '';
      document.getElementById('editIcon').value = '';
      document.getElementById('editDetail').value = '';
      resetPhotoUI();
      saveBtn.disabled = false;
      saveBtn.textContent = 'Сохранить';
      document.getElementById('editOverlay').classList.add('open');
    };

    function openEdit(item, cat, family) {
      editingItem = { family, cat, id: item.id };
      document.getElementById('editModalTitle').textContent = 'Редактировать';
      document.getElementById('editFamily').value = family;
      document.getElementById('editCreator').value = item.creator || '';
      document.getElementById('editCategory').value = cat;
      document.getElementById('editTitle').value = item.title || '';
      document.getElementById('editIcon').value = item.icon || '';
      document.getElementById('editDetail').value = item.detail || '';

      if (item.photo) {
        currentPhoto = item.photo;
        photoPreview.src = item.photo;
        photoPreview.classList.add('show');
        photoRemoveBtn.classList.add('show');
      } else {
        resetPhotoUI();
      }

      saveBtn.disabled = false;
      saveBtn.textContent = 'Сохранить';
      document.getElementById('editOverlay').classList.add('open');
    }

    document.getElementById('editClose').onclick = () => {
      document.getElementById('editOverlay').classList.remove('open');
      editingItem = null;
      resetPhotoUI();
      isSaving = false;
      saveBtn.disabled = false;
      saveBtn.textContent = 'Сохранить';
    };

    document.getElementById('editSave').onclick = async () => {
      if (isSaving) return;

      const family = document.getElementById('editFamily').value;
      const creator = document.getElementById('editCreator').value;
      const cat = document.getElementById('editCategory').value;
      const title = document.getElementById('editTitle').value.trim();

      if (!family) {
        document.getElementById('editFamily').focus();
        showStatus('Укажите семью');
        return;
      }
      if (!creator) {
        document.getElementById('editCreator').focus();
        showStatus('Укажите, кто добавляет');
        return;
      }
      if (!cat) {
        document.getElementById('editCategory').focus();
        showStatus('Выберите категорию');
        return;
      }
      if (!title) {
        document.getElementById('editTitle').focus();
        showStatus('Введите название');
        return;
      }

      isSaving = true;
      saveBtn.disabled = true;
      saveBtn.textContent = 'Сохранение…';

      const itemData = {
        icon: document.getElementById('editIcon').value.trim() || '📌',
        title: title,
        detail: document.getElementById('editDetail').value.trim(),
        creator: creator,
        createdAt: Date.now(),
        done: false
      };

      if (currentPhoto) {
        itemData.photo = currentPhoto;
      }

      const emailConfig = EMAILJS_CONFIG[family];

      try {
        if (!familiesData[family]) familiesData[family] = emptyStructure();
        if (!familiesData[family][cat]) familiesData[family][cat] = [];

        if (editingItem) {
          const oldFamily = editingItem.family;
          const oldCat = editingItem.cat;
          const id = editingItem.id;

          const oldList = familiesData[oldFamily][oldCat] || [];
          const oldItem = oldList.find(i => i.id === id);
          
          familiesData[oldFamily][oldCat] = oldList.filter(i => i.id !== id);
          
          if (oldFamily !== family) {
            await saveFamilyData(oldFamily);
          }

          itemData.id = id;
          itemData.done = oldItem ? !!oldItem.done : false;
          itemData.createdAt = oldItem ? oldItem.createdAt : Date.now();

          familiesData[family][cat].push(itemData);
          await saveFamilyData(family);
          showStatus('Изменено');
        } else {
          itemData.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          familiesData[family][cat].push(itemData);

          await saveFamilyData(family);

          try {
            await emailjs.send(emailConfig.serviceId, emailConfig.newTemplate, {
              to_email: 'shapalax@gmail.com',
              creator: creator,
              title: itemData.title,
              category: { home: 'Дом', docs: 'Документы', car: 'Машина', health: 'Здоровье' }[cat],
              detail: itemData.detail || '—',
              date: new Date().toLocaleString('ru-RU')
            });
            showStatus('Добавлено + письмо отправлено');
          } catch (err) {
            console.error(err);
            showStatus('Добавлено (письмо не ушло)');
          }
        }

        currentFamily = family;
        familyTabs.forEach(t => t.classList.toggle('active', t.dataset.family === family));
        updateHeaderView();

        tabs.forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
        currentCat = cat;
        renderList();

        document.getElementById('editOverlay').classList.remove('open');
        editingItem = null;
        resetPhotoUI();
      } catch (err) {
        console.error(err);
        showStatus('Ошибка сохранения');
      } finally {
        isSaving = false;
        saveBtn.disabled = false;
        saveBtn.textContent = 'Сохранить';
      }
    };

    document.getElementById('deleteCancel').onclick = () => {
      document.getElementById('deleteOverlay').classList.remove('open');
      itemToDelete = null;
    };

    document.getElementById('deleteConfirm').onclick = async () => {
      if (!itemToDelete) return;
      const { family, cat, id } = itemToDelete;
      
      const currentList = familiesData[family][cat] || [];
      familiesData[family][cat] = currentList.filter(i => i.id !== id);
      
      await saveFamilyData(family);

      renderList();
      document.getElementById('deleteOverlay').classList.remove('open');
      itemToDelete = null;
      showStatus('Удалено');
    };

    document.querySelectorAll('.overlay').forEach(ov => {
      ov.addEventListener('click', e => {
        if (e.target === ov) {
          if (isCompleting || isRestoring || isSaving) return;
          ov.classList.remove('open');
          editingItem = null;
          resetPhotoUI();
          isSaving = false;
          saveBtn.disabled = false;
          saveBtn.textContent = 'Сохранить';
        }
      });
    });

    updateHeaderView();
  </script>
</body>
</html>
